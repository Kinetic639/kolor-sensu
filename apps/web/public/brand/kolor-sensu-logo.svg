<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -5 700 600" width="700" height="600">
  <title>Kolor Sensu</title>
  <!-- Geometric, symmetric version of the logo (axis x = 325).
       Head: an ellipse. Face: arcs only - per side a cheek circle, an
       inner arc running on from it to the top of the beak, and an outer
       arc running on from it down behind the leaf. Eyes: a mirrored wave.
       Leaves: arcs (circles stretched upwards) and a shared stem; at the
       bottom the outer edge follows the head's outline, with a round notch at the
       bottom where the feet show. The leaves read as slightly see-through:
       inside each leaf the head (fill and outline) is drawn again in greens.
       Every part has its own group and id for animation. -->
  <defs>
    <clipPath id="ks-head"><ellipse cx="325" cy="293.5" rx="266" ry="283"/></clipPath>
    <clipPath id="ks-leaf-left"><path d="M9.42 291.41 A282.53 282.53 0 0 1 325 572 L325 576.5 A450 450 0 0 1 321 576.48 A31 31 0 0 0 265 572.48 A450 450 0 0 1 148.23 540.33 A220 220 0 0 1 20.14 386.83 A430 430 0 0 1 9.42 291.41 Z"/></clipPath>
    <clipPath id="ks-leaf-right"><path d="M640.58 291.41 A282.53 282.53 0 0 0 325 572 L325 576.5 A450 450 0 0 0 329 576.48 A31 31 0 0 1 385 572.48 A450 450 0 0 0 501.77 540.33 A220 220 0 0 0 629.86 386.83 A430 430 0 0 0 640.58 291.41 Z"/></clipPath>
  </defs>

  <g fill="none" stroke="#233b49" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <g id="head">
      <ellipse cx="325" cy="293.5" rx="266" ry="283" fill="#3e5767"/>
    </g>

    <g id="face" clip-path="url(#ks-head)">
      <path fill="#f3eae5" stroke="none" d="M325 576.5 L143.14 360 A155 155 0 0 1 111.84 196.83 A105 105 0 0 1 297.69 178.42 A170.6 170.6 0 0 1 325 271 A170.6 170.6 0 0 1 352.31 178.42 A105 105 0 0 1 538.16 196.83 A155 155 0 0 1 506.86 360 Z"/>
      <path id="face-left" d="M325 576.5 L143.14 360 A155 155 0 0 1 111.84 196.83 A105 105 0 0 1 297.69 178.42 A170.6 170.6 0 0 1 325 271 L325 278"/>
      <path id="face-right" d="M325 576.5 L506.86 360 A155 155 0 0 0 538.16 196.83 A105 105 0 0 0 352.31 178.42 A170.6 170.6 0 0 0 325 271 L325 278"/>
    </g>

    <g id="eyes">
      <path id="eye-left" d="M166 258 C180 257 191 250 205 248 C218 246 227 250 236 258"/>
      <path id="eye-right" d="M484 258 C470 257 459 250 445 248 C432 246 423 250 414 258"/>
    </g>

    <g id="beak">
      <path fill="#f3eae5" d="M309.7 302.41 A17 17 0 1 1 340.3 302.41 L325 334 Z"/>
    </g>

    <g id="leaf-left">
      <path fill="#9dc495" d="M9.42 291.41 A282.53 282.53 0 0 1 325 572 L325 576.5 A450 450 0 0 1 321 576.48 A31 31 0 0 0 265 572.48 A450 450 0 0 1 148.23 540.33 A220 220 0 0 1 20.14 386.83 A430 430 0 0 1 9.42 291.41 Z"/>
      <!-- the head seen through the leaf -->
      <g clip-path="url(#ks-leaf-left)">
        <ellipse cx="325" cy="293.5" rx="266" ry="283" fill="#82a787" stroke="#5a7b67"/>
      </g>
      <path stroke="#233b49" d="M9.42 291.41 A282.53 282.53 0 0 1 325 572 L325 576.5 A450 450 0 0 1 321 576.48 A31 31 0 0 0 265 572.48 A450 450 0 0 1 148.23 540.33 A220 220 0 0 1 20.14 386.83 A430 430 0 0 1 9.42 291.41 Z"/>
      <path fill="#233b49" stroke="none" d="M8.36 282.48 L0.42 283.41 L0.42 291.41 L9.42 291.41 Z"/>
    </g>

    <g id="leaf-right">
      <path fill="#9dc495" d="M640.58 291.41 A282.53 282.53 0 0 0 325 572 L325 576.5 A450 450 0 0 0 329 576.48 A31 31 0 0 1 385 572.48 A450 450 0 0 0 501.77 540.33 A220 220 0 0 0 629.86 386.83 A430 430 0 0 0 640.58 291.41 Z"/>
      <!-- the head seen through the leaf -->
      <g clip-path="url(#ks-leaf-right)">
        <ellipse cx="325" cy="293.5" rx="266" ry="283" fill="#82a787" stroke="#5a7b67"/>
      </g>
      <path stroke="#233b49" d="M640.58 291.41 A282.53 282.53 0 0 0 325 572 L325 576.5 A450 450 0 0 0 329 576.48 A31 31 0 0 1 385 572.48 A450 450 0 0 0 501.77 540.33 A220 220 0 0 0 629.86 386.83 A430 430 0 0 0 640.58 291.41 Z"/>
      <path fill="#233b49" stroke="none" d="M641.64 282.48 L649.58 283.41 L649.58 291.41 L640.58 291.41 Z"/>
    </g>

    <g id="feet" fill="#1a2b35" stroke="none">
      <!-- outline under the foot, then the dark foot itself -->
      <path fill="#233b49" d="M261.75 581.12 A31 31 0 0 1 322.99 585.5 A459 459 0 0 1 261.75 581.12 Z"/>
      <path id="foot-left" d="M273.06 576.51 A22 22 0 0 1 312.45 579.33 A453 453 0 0 1 273.06 576.51 Z"/>
      <path fill="#233b49" d="M388.25 581.12 A31 31 0 0 0 327.01 585.5 A459 459 0 0 0 388.25 581.12 Z"/>
      <path id="foot-right" d="M376.94 576.51 A22 22 0 0 0 337.55 579.33 A453 453 0 0 0 376.94 576.51 Z"/>
    </g>
  </g>
</svg>
