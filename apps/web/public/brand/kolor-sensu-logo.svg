<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 650 600" width="650" height="600">
  <title>Kolor Sensu</title>
  <!-- Geometric, symmetric version of the logo (axis x = 325).
       Head: an ellipse. Face: two circles almost touching on the axis;
       their inner sides meet in one line down to the beak, their outer
       sides run on as straight lines down behind the leaves. Eyes: a mirrored wave.
       Leaves: arcs (circles stretched upwards) and a shared stem, with a round notch at the
       bottom where the feet show. The leaves read as slightly see-through:
       inside each leaf the head (fill and outline) is drawn again in greens.
       Every part has its own group and id for animation. -->
  <defs>
    <clipPath id="ks-head"><ellipse cx="325" cy="293.5" rx="266" ry="283"/></clipPath>
    <clipPath id="ks-leaf-left"><path d="M16.42 291.42 A314.4 336.41 0 0 1 325 534.95 L325 576.49 A266.7 285.37 0 0 1 321 577.14 A31 33.17 0 0 0 265 579.37 A266.7 285.37 0 0 1 16.42 291.42 Z"/></clipPath>
    <clipPath id="ks-leaf-right"><path d="M633.58 291.42 A314.4 336.41 0 0 0 325 534.95 L325 576.49 A266.7 285.37 0 0 0 329 577.14 A31 33.17 0 0 1 385 579.37 A266.7 285.37 0 0 0 633.58 291.42 Z"/></clipPath>
  </defs>

  <g fill="none" stroke="#233b49" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <g id="head">
      <ellipse cx="325" cy="293.5" rx="266" ry="283" fill="#3e5767"/>
    </g>

    <g id="face" clip-path="url(#ks-head)">
      <path fill="#f3eae5" stroke="none" d="M325 248 L308.71 201 A105 105 0 0 0 105.52 250.01 L151.41 576.5 L498.59 576.5 L544.48 250.01 A105 105 0 0 0 341.29 201 Z"/>
      <path id="face-left" d="M325 271 L325 248 L308.71 201 A105 105 0 0 0 105.52 250.01 L151.41 576.5"/>
      <path id="face-right" d="M325 271 L325 248 L341.29 201 A105 105 0 0 1 544.48 250.01 L498.59 576.5"/>
    </g>

    <g id="eyes">
      <path id="eye-left" d="M166 258 C180 257 191 250 205 248 C218 246 227 250 236 258"/>
      <path id="eye-right" d="M484 258 C470 257 459 250 445 248 C432 246 423 250 414 258"/>
    </g>

    <g id="beak">
      <path fill="#f3eae5" d="M309.7 295.41 A17 17 0 1 1 340.3 295.41 L325 327 Z"/>
    </g>

    <g id="leaf-left">
      <path fill="#9dc495" d="M16.42 291.42 A314.4 336.41 0 0 1 325 534.95 L325 576.49 A266.7 285.37 0 0 1 321 577.14 A31 33.17 0 0 0 265 579.37 A266.7 285.37 0 0 1 16.42 291.42 Z"/>
      <!-- the head seen through the leaf -->
      <g clip-path="url(#ks-leaf-left)">
        <ellipse cx="325" cy="293.5" rx="266" ry="283" fill="#82a787" stroke="#5a7b67"/>
      </g>
      <path stroke="#233b49" d="M16.42 291.42 A314.4 336.41 0 0 1 325 534.95 L325 576.49 A266.7 285.37 0 0 1 321 577.14 A31 33.17 0 0 0 265 579.37 A266.7 285.37 0 0 1 16.42 291.42 Z"/>
    </g>

    <g id="leaf-right">
      <path fill="#9dc495" d="M633.58 291.42 A314.4 336.41 0 0 0 325 534.95 L325 576.49 A266.7 285.37 0 0 0 329 577.14 A31 33.17 0 0 1 385 579.37 A266.7 285.37 0 0 0 633.58 291.42 Z"/>
      <!-- the head seen through the leaf -->
      <g clip-path="url(#ks-leaf-right)">
        <ellipse cx="325" cy="293.5" rx="266" ry="283" fill="#82a787" stroke="#5a7b67"/>
      </g>
      <path stroke="#233b49" d="M633.58 291.42 A314.4 336.41 0 0 0 325 534.95 L325 576.49 A266.7 285.37 0 0 0 329 577.14 A31 33.17 0 0 1 385 579.37 A266.7 285.37 0 0 0 633.58 291.42 Z"/>
    </g>

    <g id="feet" fill="#1a2b35" stroke="none">
      <!-- outline under the foot, then the dark foot itself -->
      <path fill="#233b49" d="M262.68 588.85 A31 33.17 0 0 1 323.98 586.4 A275.7 295 0 0 1 262.68 588.85 Z"/>
      <path id="foot-left" d="M273.32 583.05 A22 23.54 0 0 1 312.96 581.47 A269.7 288.58 0 0 1 273.32 583.05 Z"/>
      <path fill="#233b49" d="M387.32 588.85 A31 33.17 0 0 0 326.02 586.4 A275.7 295 0 0 0 387.32 588.85 Z"/>
      <path id="foot-right" d="M376.68 583.05 A22 23.54 0 0 0 337.04 581.47 A269.7 288.58 0 0 0 376.68 583.05 Z"/>
    </g>
  </g>
</svg>
