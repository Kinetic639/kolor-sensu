<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 590" width="650" height="590">
  <title>Kolor Sensu</title>
  <!-- Geometric, symmetric version of the logo (axis x = 325).
       Head: a circle. Face: two half circles on straight sides, meeting on
       the axis and running down to the beak. Beak: a circle with tangents
       to a point. Eyes: circular arcs. Leaves: two circular arcs each.
       The leaves read as slightly see-through: inside each leaf the head
       (fill and outline) is drawn again in greens.
       Every part has its own group and id for animation. -->
  <defs>
    <clipPath id="ks-head"><circle cx="325" cy="282" r="270"/></clipPath>
    <clipPath id="ks-leaf-left"><path d="M15 296 A271.71 271.71 0 0 1 325 565 A313.12 313.12 0 0 1 15 296 Z"/></clipPath>
    <clipPath id="ks-leaf-right"><path d="M635 296 A271.71 271.71 0 0 0 325 565 A313.12 313.12 0 0 0 635 296 Z"/></clipPath>
  </defs>

  <g fill="none" stroke="#233b49" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <g id="head">
      <circle cx="325" cy="282" r="270" fill="#3e5767"/>
    </g>

    <g id="face" clip-path="url(#ks-head)">
      <path fill="#f3eae5" stroke="none" d="M101 565 L101 245 A112 112 0 0 1 325 245 A112 112 0 0 1 549 245 L549 565 Z"/>
      <path id="face-left" d="M101 297.51 L101 245 A112 112 0 0 1 325 245 L325 276"/>
      <path id="face-right" d="M549 297.51 L549 245 A112 112 0 0 0 325 245 L325 276"/>
    </g>

    <g id="eyes">
      <path id="eye-left" d="M167 259 A62.8 62.8 0 0 1 235 259"/>
      <path id="eye-right" d="M415 259 A62.8 62.8 0 0 1 483 259"/>
    </g>

    <g id="beak">
      <path fill="#f3eae5" d="M309.9 300.81 A17 17 0 1 1 340.1 300.81 L325 330 Z"/>
    </g>

    <g id="leaf-left">
      <path fill="#9dc495" d="M15 296 A271.71 271.71 0 0 1 325 565 A313.12 313.12 0 0 1 15 296 Z"/>
      <!-- the head seen through the leaf -->
      <g clip-path="url(#ks-leaf-left)">
        <circle cx="325" cy="282" r="270" fill="#82a787" stroke="#5a7b67"/>
      </g>
      <path stroke="#233b49" d="M15 296 A271.71 271.71 0 0 1 325 565 A313.12 313.12 0 0 1 15 296 Z"/>
    </g>

    <g id="leaf-right">
      <path fill="#9dc495" d="M635 296 A271.71 271.71 0 0 0 325 565 A313.12 313.12 0 0 0 635 296 Z"/>
      <!-- the head seen through the leaf -->
      <g clip-path="url(#ks-leaf-right)">
        <circle cx="325" cy="282" r="270" fill="#82a787" stroke="#5a7b67"/>
      </g>
      <path stroke="#233b49" d="M635 296 A271.71 271.71 0 0 0 325 565 A313.12 313.12 0 0 0 635 296 Z"/>
    </g>
  </g>
</svg>
