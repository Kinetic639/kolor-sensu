<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none">
  <defs>
    <filter id="paper-edge" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".025 .04"
        numOctaves="2"
        seed="12"
        result="grain"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="grain"
        scale="3.5"
        xChannelSelector="R"
        yChannelSelector="G"
      />
      <feGaussianBlur stdDeviation=".55" />
    </filter>
  </defs>
  <!-- A quiet, irregular paper edge; the interior remains completely opaque. -->
  <path
    fill="white"
    filter="url(#paper-edge)"
    d="M 24 12 C 79 10 135 15 191 12 S 289 15 347 11 S 449 14 508 12 S 612 16 674 12 S 785 14 846 11 C 869 10 884 14 887 28 C 891 79 884 130 889 185 S 884 283 888 337 S 885 434 889 491 C 890 532 886 557 887 570 C 888 584 878 590 859 588 C 800 585 743 591 687 587 S 584 591 524 588 S 412 592 354 587 S 245 591 186 588 S 82 591 35 587 C 18 586 10 580 12 565 C 16 513 9 460 13 404 S 10 301 14 249 S 9 143 13 93 C 16 58 10 39 14 24 C 15 17 18 13 24 12 Z"
  />
</svg>
