# After DEV is deployed, the end-to-end tests run against the live sites
# (tests/e2e, E2E_TARGET=dev): a guest books and pays with BLIK, the visit
# shows in both portals, the portals sign in and out, the public API keeps
# its fields to itself; from the e-mails' links (read back from Resend), a
# visit paid later, moved and cancelled with a refund. Each run leaves a
# few test visits behind.
#
# After STAGING is deployed (a release), only the tests that look run
# against it (E2E_TARGET=staging, tests/e2e/support/read-only.ts): the
# pages, links, axe, the keyboard, the portals' sign-in pages and the
# public API. STAGING is the client's own, so nothing there books, signs
# up or signs in; this only says the release is up and its setup sound.
#
# Vercel reports each app's deployment to GitHub (by commit, not branch),
# so this starts on those reports and goes on only once all three apps
# are live with the commit at the head of `develop` or `staging`, and only
# for the last of the three, so a commit is tested once. It can be started
# by hand too (Actions → E2E → Run workflow) for either; started by hand,
# it runs the tests of that branch's head, not of the branch chosen, and
# for DEV it can run the payment tests alone (tests/e2e/payments.spec.ts:
# card, 3D Secure, a declined card, Przelewy24).
#
# Secrets (Settings → Secrets and variables → Actions):
#   E2E_ANNA_EMAIL, E2E_ANNA_PASSWORD (DEV's admin),
#   E2E_SPECIALIST_EMAIL, E2E_SPECIALIST_PASSWORD,
#   E2E_RESEND_API_KEY (reads the sent e-mails; without it those tests skip),
#   E2E_BYPASS_KEY (the same as the web app's on DEV in Vercel: each hold
#   then counts alone, not against one runner's 5 in 15 minutes; #345)
name: E2E

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: "Where: DEV (everything) or STAGING (only the tests that look)"
        type: choice
        options: [dev, staging]
        default: dev
      payments:
        description: "DEV: only the payment tests (card, 3D Secure, declined card, Przelewy24)"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

jobs:
  ready:
    name: Is it deployed?
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      sha: ${{ steps.check.outputs.sha }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.target }}
          SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT: ${{ github.event.deployment.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            branch=$([ "$CHOSEN" = staging ] && echo staging || echo develop)
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "target=$CHOSEN" >> "$GITHUB_OUTPUT"
            echo "sha=$(gh api "repos/$REPO/commits/$branch" --jq .sha)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$SHA" = "$(gh api "repos/$REPO/commits/develop" --jq .sha)" ]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
          elif [ "$SHA" = "$(gh api "repos/$REPO/commits/staging" --jq .sha)" ]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is not the head of develop or staging: nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Each app's deployment of this commit, and when it went live.
          latest="" latest_at=""
          for app in web admin specialist; do
            env="Preview – kolor-sensu-$app"
            id=$(gh api -X GET "repos/$REPO/deployments" -f sha="$SHA" -f environment="$env" --jq '.[0].id // empty')
            at=$([ -n "$id" ] && gh api "repos/$REPO/deployments/$id/statuses" --jq '[.[] | select(.state == "success")][0].created_at // empty' || true)
            if [ -z "$at" ]; then
              echo "::notice::kolor-sensu-$app is not live with $SHA yet."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$latest_at" ] || [[ "$at" > "$latest_at" ]]; then
              latest=$id latest_at=$at
            fi
          done
          if [ "$latest" != "$DEPLOYMENT" ]; then
            echo "::notice::Another app went live last; its run tests this commit."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  e2e:
    name: ${{ needs.ready.outputs.target == 'staging' && 'Read-only on STAGING' || 'End-to-end on DEV' }}
    needs: ready
    if: needs.ready.outputs.run == 'true'
    # Only here, not on the whole workflow: every deployment report starts
    # it, and a later one waiting in the same group would cancel the
    # commit's run while one is going.
    concurrency:
      group: e2e-${{ needs.ready.outputs.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TARGET: ${{ needs.ready.outputs.target }}
      E2E_PAYMENTS: ${{ inputs.payments && needs.ready.outputs.target == 'dev' && '1' || '' }}
      E2E_ANNA_EMAIL: ${{ secrets.E2E_ANNA_EMAIL }}
      E2E_ANNA_PASSWORD: ${{ secrets.E2E_ANNA_PASSWORD }}
      E2E_SPECIALIST_EMAIL: ${{ secrets.E2E_SPECIALIST_EMAIL }}
      E2E_SPECIALIST_PASSWORD: ${{ secrets.E2E_SPECIALIST_PASSWORD }}
      E2E_RESEND_API_KEY: ${{ secrets.E2E_RESEND_API_KEY }}
      E2E_BYPASS_KEY: ${{ secrets.E2E_BYPASS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ready.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e
      - name: Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Accounts
        if: needs.ready.outputs.target == 'dev'
        run: |
          for name in E2E_ANNA_EMAIL E2E_ANNA_PASSWORD E2E_SPECIALIST_EMAIL E2E_SPECIALIST_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is missing."
              exit 1
            fi
          done
      - name: Tests
        run: pnpm test:e2e ${{ env.E2E_PAYMENTS && 'tests/e2e/payments.spec.ts' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
