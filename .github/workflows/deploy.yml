# A push to develop deploys to DEV, one to staging to STAGING. First the
# whole CI (ci.yml) runs again on what was pushed: the free GitHub plan
# cannot stop a red pull request from being merged, so nothing is deployed
# unless it is green. Then the database migrations (the apps follow).
#
# Each environment's Supabase project is a repository variable
# (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_DEV_PROJECT_REF, SUPABASE_STAGING_PROJECT_REF
# and the CLI signs in with the secret SUPABASE_ACCESS_TOKEN (a personal
# access token, supabase.com/dashboard/account/tokens). An environment
# without its project is skipped, with a notice.
name: Deploy

on:
  push:
    branches: [develop, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  database:
    name: Database migrations
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ github.ref_name == 'develop' && vars.SUPABASE_DEV_PROJECT_REF || github.ref_name == 'staging' && vars.SUPABASE_STAGING_PROJECT_REF || '' }}
      TARGET: ${{ github.ref_name == 'develop' && 'DEV' || 'STAGING' }}
    steps:
      - name: Check the environment is set up
        id: target
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::notice::$TARGET has no Supabase project yet: nothing to migrate."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN secret is missing."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.target.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.target.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - if: steps.target.outputs.ready == 'true'
        name: Link ${{ env.TARGET }}
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.target.outputs.ready == 'true'
        name: Migrations to apply
        run: supabase db push --linked --dry-run
      - if: steps.target.outputs.ready == 'true'
        name: Apply them
        run: supabase db push --linked --yes
      # Auth (site and redirect addresses, sign-ups), the Data API and
      # storage, as supabase/config.toml says, with the environment's
      # [remotes.*] overrides: the dashboard never drifts from the repo.
      - if: steps.target.outputs.ready == 'true'
        name: Settings from config.toml
        run: supabase config push --yes
