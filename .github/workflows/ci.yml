# Every pull request, every push to main, and every deployment (deploy.yml
# calls it first): the code (format and lint, types, unit tests, side by
# side) and the database (the migrations from scratch on a local Supabase
# in the runner, then every database test). Turborepo's cache carries over
# between runs, so a package a change does not touch is not checked again.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-name: lint
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-name: types
      - run: pnpm typecheck

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - run: pnpm test:run

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase (database, auth, storage, realtime)
        run: >-
          supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Database tests
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status=0
          for test in supabase/tests/*.sql; do
            if psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$test" > /dev/null 2> error.log; then
              echo "PASS $test"
            else
              echo "::error file=$test::$(tail -n 5 error.log | tr '\n' ' ')"
              status=1
            fi
          done
          exit $status
