<rect id="m3458764688777721164" data-miro-id="3458764688777721164" x="271" y="220" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; admin jest w portalu&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; tworzy kupon: kod, procent albo kwota, ważność, limit użyć, na co działa&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; kupon działa od razu, lista pokazuje jego stan" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688777721165" data-miro-id="3458764688777721165" x="1394" y="220" width="572" height="228" data-content="Wcześniej: Kod, procent albo kwota, ważność, wyłączenie i limit w portalu; wybór usług i kody osobiste na później. Do sprawdzenia → &lt;b&gt;różowy&lt;/b&gt;" rx="8" fill="#ffcee0" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
