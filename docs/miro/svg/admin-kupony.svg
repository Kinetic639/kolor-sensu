<rect id="m3458764688777721167" data-miro-id="3458764688777721167" x="271" y="468" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; kupon był używany&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; admin otwiera kupon&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; widzi, kto, kiedy i przy jakiej wizycie go użył; może go wyłączyć" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688777721168" data-miro-id="3458764688777721168" x="1394" y="468" width="572" height="228" data-content="Wcześniej: Lista kodów z liczbą użyć i wyłączanie; pełnej historii brak. Do sprawdzenia → &lt;b&gt;różowy&lt;/b&gt;" rx="8" fill="#ffcee0" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688777721169" data-miro-id="3458764688777721169" data-type="sticky" x="48" y="716" width="199" height="228" data-content="3. Ustawienie „kupony wracają po odwołaniu”" data-color="light_pink" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688777721170" data-miro-id="3458764688777721170" x="271" y="716" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; w ustawieniach kuponów admin włączył albo wyłączył „kupony wracają po odwołaniu” (domyślnie wyłączone)&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; wizyta z kuponem zostaje odwołana&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; kupon wraca do użycia albo przepada, zgodnie z ustawieniem" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688777721171" data-miro-id="3458764688777721171" x="1394" y="716" width="572" height="228" data-content="Wcześniej: Nie zrobione. Do sprawdzenia → &lt;b&gt;różowy&lt;/b&gt;" rx="8" fill="#ffcee0" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688777721172" data-miro-id="3458764688777721172" data-type="sticky" x="48" y="964" width="199" height="228" data-content="4. Centrum odwołuje wizytę z kuponem" data-color="light_pink" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688777721173" data-miro-id="3458764688777721173" x="271" y="964" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; wizyta była opłacona z kuponem, a centrum musi ją odwołać&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; admin odwołuje ją w portalu&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; widzi komunikat o kuponie, może go oddać i przedłużyć ważność; klient dostaje to w mailu" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
