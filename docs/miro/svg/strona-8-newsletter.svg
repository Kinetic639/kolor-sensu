<textArea id="m3458764688271356075" data-miro-id="3458764688271356075" x="48" y="104" width="1900" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left"><a href="https://miro.com/app/board/uXjVEaKfAoo=/?moveToWidget=3458764687433275743">← wróć do mapy</a> · archiwum, jedno wydanie, potwierdzenie i wypisanie: każda karteczka i jej wyjaśnienie</textArea>
<textArea id="m3458764688271356076" data-miro-id="3458764688271356076" x="48" y="174" width="133" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Karteczka</textArea>
<textArea id="m3458764688271356077" data-miro-id="3458764688271356077" x="271" y="158" width="195" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Co ma się dziać</textArea>
<textArea id="m3458764688271356078" data-miro-id="3458764688271356078" x="1395" y="158" width="325" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Czym sprawdzone → kolor</textArea>
<rect id="m3458764688271356079" data-miro-id="3458764688271356079" data-type="sticky" x="48" y="220" width="199" height="228" data-content="1. Zapis z każdego miejsca" data-color="light_green" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356081" data-miro-id="3458764688271356081" x="271" y="220" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; klient jest w stopce, pod artykułem, w archiwum newslettera albo przy rezerwacji&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; wpisuje e-mail i zaznacza zgodę&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; dostaje e-mail z linkiem potwierdzenia; na liście jest dopiero po kliknięciu" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356083" data-miro-id="3458764688271356083" x="1395" y="220" width="572" height="228" data-content="Testy strony (formularz, Turnstile, błędy przy polach) i bazy (link działa raz i 7 dni, najwyżej 5 adresów na godzinę z jednego miejsca) → &lt;b&gt;zielony&lt;/b&gt;" rx="8" fill="#d5f692" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356084" data-miro-id="3458764688271356084" data-type="sticky" x="48" y="468" width="199" height="228" data-content="2. Potwierdzenie zapisu" data-color="light_yellow" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356085" data-miro-id="3458764688271356085" x="271" y="468" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; klient otworzył link z e-maila (/newsletter/potwierdz)&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; klika „Potwierdź”&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; jest na liście i widzi „Gotowe”; link stary, zastąpiony albo bez kodu: jasny komunikat i droga do ponownego zapisu" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356086" data-miro-id="3458764688271356086" x="1395" y="468" width="572" height="228" data-content="Ważność linku w teście bazy; strona i jej komunikaty bez testu → &lt;b&gt;żółty&lt;/b&gt;" rx="8" fill="#fff6b6" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356087" data-miro-id="3458764688271356087" data-type="sticky" x="48" y="716" width="199" height="228" data-content="3. E-mail powitalny" data-color="light_yellow" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356088" data-miro-id="3458764688271356088" x="271" y="716" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; klient potwierdził zapis&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; zapis się udaje&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; dostaje krótkie powitanie: co przychodzi, jak często i jak się wypisać" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356089" data-miro-id="3458764688271356089" x="1395" y="716" width="572" height="228" data-content="Wysyłka po potwierdzeniu jest w kodzie; treść i wysyłka bez testu → &lt;b&gt;żółty&lt;/b&gt;" rx="8" fill="#fff6b6" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356090" data-miro-id="3458764688271356090" data-type="sticky" x="48" y="964" width="199" height="228" data-content="4. Archiwum wydań" data-color="light_green" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356093" data-miro-id="3458764688271356093" x="271" y="964" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; centrum wysłało wydania i zostawiło je w archiwum&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; klient otwiera /newsletter&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; widzi wydania od najnowszego, z numerem i datą, i zapis pod nimi; przed pierwszym wydaniem: „Pierwszy newsletter jeszcze przed nami”; zaplanowane pojawia się po wysłaniu" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356094" data-miro-id="3458764688271356094" x="1395" y="964" width="572" height="228" data-content="Test bazy (tylko wysłane i zostawione w archiwum, dla każdego); test listy i pustego stanu → &lt;b&gt;zielony&lt;/b&gt;" rx="8" fill="#d5f692" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356095" data-miro-id="3458764688271356095" data-type="sticky" x="48" y="1212" width="199" height="228" data-content="5. Jedno wydanie" data-color="light_green" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356096" data-miro-id="3458764688271356096" x="271" y="1212" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; wydanie jest w archiwum&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; klient otwiera /newsletter/[numer]&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; widzi temat, numer i datę, wstęp, karty artykułów i e-booków, zakończenie i „Wszystkie wydania”; artykuł wycofany po wysyłce znika z wydania; wydanie spoza archiwum: 404" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356097" data-miro-id="3458764688271356097" x="1395" y="1212" width="572" height="228" data-content="Karty i pomijanie wycofanych: testy; wydanie spoza archiwum: test bazy → &lt;b&gt;zielony&lt;/b&gt;" rx="8" fill="#d5f692" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356106" data-miro-id="3458764688271356106" data-type="sticky" x="48" y="1460" width="199" height="228" data-content="6. Wypisanie jednym kliknięciem" data-color="light_green" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356107" data-miro-id="3458764688271356107" x="271" y="1460" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; klient klika „Wypisz się” w wydaniu (/newsletter/wypisz)&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; potwierdza przyciskiem&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; widzi swój zamaskowany adres, a po kliknięciu znika z listy od razu; zły kod: komunikat" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356108" data-miro-id="3458764688271356108" x="1395" y="1460" width="572" height="228" data-content="Testy bazy i kodu, link w e-mailu w teście; strona po polsku (#159, PR #160) → &lt;b&gt;zielony&lt;/b&gt;" rx="8" fill="#d5f692" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356109" data-miro-id="3458764688271356109" data-type="sticky" x="48" y="1708" width="199" height="228" data-content="7. Wypis i odbicia w Resend" data-color="light_green" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356110" data-miro-id="3458764688271356110" x="271" y="1708" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; klient wypisał się w Resend, adres odbija na stałe albo zgłosił e-mail jako spam&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; Resend o tym powiadamia&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; adres przestaje dostawać newsletter" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356111" data-miro-id="3458764688271356111" x="1395" y="1708" width="572" height="228" data-content="Testy webhooka i synchronizacji z Resend → &lt;b&gt;zielony&lt;/b&gt;" rx="8" fill="#d5f692" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356112" data-miro-id="3458764688271356112" data-type="sticky" x="48" y="1956" width="199" height="228" data-content="8. Google i prywatność linków" data-color="light_yellow" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356113" data-miro-id="3458764688271356113" x="271" y="1956" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; jest co najmniej jedno wydanie&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; Google odwiedza stronę&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; archiwum i wydania są w mapie strony, z tytułem „temat · Newsletter nr N”; strony potwierdzenia i wypisu nie są indeksowane i nie przekazują adresu dalej" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356114" data-miro-id="3458764688271356114" x="1395" y="1956" width="572" height="228" data-content="Mapa strony: test; brak indeksowania stron z linków bez testu → &lt;b&gt;żółty&lt;/b&gt;" rx="8" fill="#fff6b6" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356115" data-miro-id="3458764688271356115" data-type="sticky" x="48" y="2204" width="199" height="228" data-content="9. Każda strona" data-color="light_yellow" data-text-align="center" data-text-align-vertical="middle" />
<rect id="m3458764688271356116" data-miro-id="3458764688271356116" x="271" y="2204" width="1100" height="228" data-content="&lt;b&gt;Zakładając:&lt;/b&gt; cztery strony Newslettera są gotowe&lt;br /&gt;&lt;b&gt;Gdy:&lt;/b&gt; sprawdzamy tabelę „Każda strona”&lt;br /&gt;&lt;b&gt;Wtedy:&lt;/b&gt; każda ma jeden H1, działa na telefonie i klawiaturą, bez błędów dostępności" rx="8" fill="#f5f6f8" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
<rect id="m3458764688271356117" data-miro-id="3458764688271356117" x="1395" y="2204" width="572" height="228" data-content="Strony działają; test end-to-end (H1, telefon, axe) brak → &lt;b&gt;żółty&lt;/b&gt;" rx="8" fill="#fff6b6" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" data-text-align="left" data-text-align-vertical="middle" stroke="none" />
